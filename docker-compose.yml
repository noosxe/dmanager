services:
  dmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dmanager
    restart: unless-stopped
    # Raise docker's stop timeout above the app's 10s graceful-drain budget; s6
    # waits indefinitely for s6-rc services, so docker is the real ceiling.
    stop_grace_period: 15s
    ports:
      - "9283:9283"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dmanager-data:/var/lib/dmanager
      # Optional: Uncomment to override the default configuration with a host file
      # - ./config.yaml:/etc/dmanager/config.yaml:ro
    environment:
      # Optional environment variable overrides (prefixed with DMANAGER_)
      - DMANAGER_SERVER_PORT=9283
      - DMANAGER_SCHEDULER_INTERVAL_MINUTES=60
      # WebAuthn / Passkeys for local development/testing on http://localhost:9283
      - DMANAGER_WEBAUTHN_RP_ID=localhost
      - DMANAGER_WEBAUTHN_ORIGINS=http://localhost:9283
      # Registry Credentials Example:
      # - DMANAGER_REGISTRIES_0_HOST=ghcr.io
      # - DMANAGER_REGISTRIES_0_USERNAME=myuser
      # - DMANAGER_REGISTRIES_0_PASSWORD=mypassword
      # Embedded Tailscale node (docs/tailscale.md): set an auth key to serve
      # dmanager directly on your tailnet — no published ports needed.
      # Node state persists under /var/lib/dmanager/tailscale (same volume
      # as the database), so the key is only needed for the first start.
      # - TAILSCALE_AUTHKEY=tskey-auth-xxxxxxxxxxxx-xxxxxxxxxxxxx
      # - TAILSCALE_HOSTNAME=dmanager

volumes:
  dmanager-data:

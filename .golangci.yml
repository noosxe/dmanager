version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
        - name: package-comments
          disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - third_party
    - builtin
    - examples
    - .system_generated
  exclude-rules:
    - path: \.sql\.go
      linters:
        - errcheck
    - path: \.pb\.go
      linters:
        - errcheck
        - gosec
        - goimports
        - gofmt

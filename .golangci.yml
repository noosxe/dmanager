version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          severity: warning
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    paths:
      - third_party
      - builtin
      - examples
      - .system_generated
    rules:
      - path: \.sql\.go
        linters:
          - errcheck
      - path: \.pb\.go
        linters:
          - errcheck
          - gosec
          - goimports
          - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

server:
  port: "9283"
  db_path: "/var/lib/dmanager/dmanager.db"
  allowed_origins: []
docker:
  host: "unix:///var/run/docker.sock"
scheduler:
  interval_minutes: 60
# Embedded Tailscale node — enabled iff auth_key is set (docs/tailscale.md).
# The state dir defaults to /var/lib/dmanager/tailscale (beside db_path).
tailscale: {}

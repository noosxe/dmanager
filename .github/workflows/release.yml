name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "repo_name=${REPO,,}" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}:${{ github.ref_name }}
            ghcr.io/${{ steps.string.outputs.repo_name }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ### Container Images

            Multi-platform (`linux/amd64` and `linux/arm64`) Docker images are available on GitHub Container Registry (GHCR):

            ```bash
            docker pull ghcr.io/${{ steps.string.outputs.repo_name }}:${{ github.ref_name }}
            ```

            Or pull the latest version:

            ```bash
            docker pull ghcr.io/${{ steps.string.outputs.repo_name }}:latest
            ```

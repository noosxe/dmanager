syntax = "proto3";

package dmanager.v1;

import "google/protobuf/timestamp.proto";

option go_package = "dmanager/internal/gen/proto/dmanager/v1;dmanagerv1";

// AdminService exposes Docker host resources (images, volumes, networks)
// for the Administration page. Lists are read-only for every role;
// destructive procedures (image deletion, prunes) are admin-gated.
// Volumes gain on-demand usage measurement (any role) and an unused-volume
// reclaim (admin); networks have no mutating procedures.
service AdminService {
  // List images present on the host (Authenticated, any role).
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  // List volumes present on the host (Authenticated, any role).
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // Measure local volume disk usage (Authenticated, any role). Expensive on
  // the daemon: each call recursively walks every local volume's directory
  // tree, serially and uncached (singleflight only deduplicates concurrent
  // calls) — so the web UI must trigger this only on explicit user action,
  // never automatically.
  rpc GetVolumeUsage(GetVolumeUsageRequest) returns (GetVolumeUsageResponse);

  // List networks present on the host (Authenticated, any role).
  rpc ListNetworks(ListNetworksRequest) returns (ListNetworksResponse);

  // Delete an image from the host (Authenticated, admin role). The
  // daemon refuses images referenced by any container regardless of force.
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);

  // Prune all unused images from the host in one daemon call (Authenticated,
  // admin role). The daemon refuses images referenced by any container
  // unconditionally; with dangling_only it restricts to untagged images.
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);

  // Prune all unused volumes from the host in one call (Authenticated, admin
  // role). Sends all=true so named volumes are included; the daemon removes
  // only volumes not referenced by any container — running or stopped — at
  // prune time, re-evaluating references itself.
  rpc PruneVolumes(PruneVolumesRequest) returns (PruneVolumesResponse);

  // Delete a network from the host (Authenticated, admin role). The daemon
  // refuses in-use networks ("has active endpoints") and pre-defined ones
  // (bridge/host/none) regardless of the request — the client only hides
  // the affordance; the daemon remains the gatekeeper.
  rpc DeleteNetwork(DeleteNetworkRequest) returns (DeleteNetworkResponse);

  // Prune all unused networks from the host in one call (Authenticated,
  // admin role). No filters: the daemon's scope is fixed — local-path prune
  // skips config-only, non-pruneable (pre-defined) and endpoint-carrying
  // networks; the cluster path additionally skips the swarm-ingress network;
  // protection is re-evaluated at prune time. The report carries names only,
  // no byte figures.
  rpc PruneNetworks(PruneNetworksRequest) returns (PruneNetworksResponse);

  // Report builder-owned disk space: the BuildKit build cache aggregates
  // as supplied by the daemon (Authenticated, any role).
  rpc GetBuildCacheStats(GetBuildCacheStatsRequest) returns (GetBuildCacheStatsResponse);

  // Prune build cache records in one daemon call (Authenticated, admin role).
  // With all=false buildkit-internal cache types are preserved; records in
  // active use are never removed (enforced daemon-side).
  rpc PruneBuildCache(PruneBuildCacheRequest) returns (PruneBuildCacheResponse);

  // List the daemon's build cache records, sorted by size descending — the
  // size-sorted top-offenders view (Authenticated, any role).
  rpc ListBuildCacheRecords(ListBuildCacheRecordsRequest) returns (ListBuildCacheRecordsResponse);

  // Prune exactly one build cache record by its full ID (Authenticated,
  // admin role). The daemon matches the ID via its id filter; records in
  // active use are never removed (enforced daemon-side).
  rpc PruneBuildCacheRecord(PruneBuildCacheRecordRequest) returns (PruneBuildCacheRecordResponse);

  // Report whether the Docker Engine is reachable (Authenticated, any role).
  // Daemon unreachability is a successful response with connected=false —
  // the outage is the answer, not an RPC failure (design.md §10.2).
  rpc CheckEngine(CheckEngineRequest) returns (CheckEngineResponse);

  // Review the audit trail (Authenticated, admin role): recorded mutation
  // outcomes by users and system-originated automatic updates, filtered and
  // paginated server-side. Entries are written by the server, never by RPC.
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
}

message ListImagesRequest {}

message ListImagesResponse {
  repeated Image images = 1;
}

message Image {
  // Image ID (sha256:...), rendered short-form client-side.
  string id = 1;

  // Repository tags (e.g. ["nginx:latest"]); empty for dangling images.
  repeated string repo_tags = 2;

  // Image creation time as Unix seconds.
  int64 created_unix = 3;

  // On-disk size in bytes.
  int64 size_bytes = 4;

  // Number of containers referencing this image; -1 when the daemon
  // did not calculate the value.
  int64 containers_count = 5;
}

message ListVolumesRequest {}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message Volume {
  string name = 1;

  // Volume driver (e.g. "local").
  string driver = 2;

  // Host mount path, rendered truncated client-side.
  string mountpoint = 3;

  google.protobuf.Timestamp created_at = 4;

  // User-defined key/value metadata.
  map<string, string> labels = 5;
}

message ListNetworksRequest {}

message ListNetworksResponse {
  repeated Network networks = 1;
}

message Network {
  // Network ID (sha256:...), rendered short-form client-side.
  string id = 1;

  // Network name (e.g. "bridge").
  string name = 2;

  // Network driver (e.g. "bridge", "host", "overlay").
  string driver = 3;

  // Network scope ("local", "swarm", or "global").
  string scope = 4;

  // Whether the network is isolated from external routing.
  bool internal = 5;

  google.protobuf.Timestamp created_at = 6;

  // Number of containers attached to this network. Populated via one
  // per-network inspect (the list endpoint carries no attachment data on
  // API >= 1.28); a stopped container still counts — its endpoint persists
  // until the container is removed. -1 when the per-network inspect failed
  // (usage unknown; the rest of the list is unaffected).
  int64 containers_count = 7;

  // True when the daemon owns this network (bridge, host, none on Linux):
  // deletion is always refused with "is a pre-defined network", so clients
  // hide delete affordances.
  bool predefined = 8;
}

message DeleteNetworkRequest {
  // Network ID exactly as returned by ListNetworks.
  string id = 1;
}

message DeleteNetworkResponse {}

message PruneNetworksRequest {}

message PruneNetworksResponse {
  // Count of networks the daemon actually removed; daemon-protected ones
  // are simply absent (protection re-evaluated at prune time).
  uint64 networks_deleted = 1;

  // Removed networks' names, for the success toast.
  repeated string names = 2;
}

message DeleteImageRequest {
  // Image ID (sha256:...) exactly as returned by ListImages.
  string id = 1;

  // Bypass tag-conflict errors for multi-tag images; the daemon still
  // refuses images referenced by any container.
  bool force = 2;
}

message DeleteImageResponse {}

message PruneImagesRequest {
  // false (default): delete every image not used by any container
  // (docker image prune -a semantics); true: untagged (dangling) images only.
  bool dangling_only = 1;
}

message PrunedImage {
  // Image ID removed from disk.
  string deleted = 1;

  // Tag reference removed (the image may still exist under other tags).
  string untagged = 2;
}

message PruneImagesResponse {
  // Per-image report as returned by the daemon.
  repeated PrunedImage images_deleted = 1;

  // Bytes actually reclaimed on disk.
  uint64 space_reclaimed = 2;
}

message GetBuildCacheStatsRequest {}

message GetBuildCacheStatsResponse {
  // Total on-disk size of all build cache records.
  uint64 total_bytes = 1;

  // Size excluding records whose blobs are shared with other records —
  // the daemon's conservative reclaim estimate.
  uint64 reclaimable_bytes = 2;

  // Number of build cache records.
  uint32 record_count = 3;

  // Number of records in active use by a running build.
  uint32 active_count = 4;
}

message PruneBuildCacheRequest {
  // false (default): preserve buildkit-internal cache types; true: remove
  // them as well. Records in active use are never removed either way.
  bool all = 1;
}

message PruneBuildCacheResponse {
  // Number of removed cache records.
  uint32 caches_deleted = 1;

  // Bytes actually reclaimed on disk.
  uint64 space_reclaimed = 2;
}

// A single BuildKit build cache record. Records are opaque content hashes
// with a build-step description; identity for prune is the full id.
message BuildCacheRecord {
  // Full content hash — the prune target.
  string id = 1;

  // Buildkit record type: regular, source.local, exec.cachemount, …
  string type = 2;

  // Human-readable build step, e.g. "exec mount /bin/sh …"; may be empty.
  string description = 3;

  // On-disk size of the record's blobs.
  uint64 size_bytes = 4;

  // True while a build references this record — daemon-protected.
  bool in_use = 5;

  // True when blobs are shared with other records — deletion may free
  // less than size_bytes.
  bool shared = 6;

  // How many builds have used this record.
  uint64 usage_count = 7;

  google.protobuf.Timestamp created_at = 8;

  // Absent for records never used by a build.
  optional google.protobuf.Timestamp last_used_at = 9;
}

message ListBuildCacheRecordsRequest {}

message ListBuildCacheRecordsResponse {
  // All records, sorted by size_bytes descending.
  repeated BuildCacheRecord records = 1;
}

message PruneBuildCacheRecordRequest {
  // Full record ID (required).
  string id = 1;
}

message PruneBuildCacheRecordResponse {
  // Number of removed records — 0 when the daemon protected the record.
  uint32 caches_deleted = 1;

  // Bytes actually reclaimed on disk.
  uint64 space_reclaimed = 2;
}

message CheckEngineRequest {}

message CheckEngineResponse {
  bool connected = 1;    // true when the daemon answered the ping
  string api_version = 2; // daemon API version, e.g. "1.51"
  string error = 3;       // short reason when connected is false, empty otherwise
}

message GetVolumeUsageRequest {}

message VolumeUsage {
  // Volume name (the join key against the ListVolumes response).
  string name = 1;

  // Size in bytes; -1 when the daemon's per-volume walk failed.
  int64 size_bytes = 2;

  // Container config references (running or stopped); -1 when unavailable.
  int64 ref_count = 3;
}

message GetVolumeUsageResponse {
  // Measured volumes, in daemon order.
  repeated VolumeUsage volumes = 1;

  // Daemon-computed sums; sizes of -1 are excluded from both.
  int64 total_size_bytes = 2;
  int64 reclaimable_bytes = 3; // sum of sizes where ref_count == 0

  // Count of volumes with ref_count == 0.
  uint32 unused_count = 4;
}

message PruneVolumesRequest {}

message PruneVolumesResponse {
  uint32 volumes_deleted = 1;

  // Names of the removed volumes (for the success toast).
  repeated string names = 2;

  uint64 space_reclaimed = 3;
}

// ---------------------------------------------------------------------------
// Audit trail (issue #219, design.md §12)
// ---------------------------------------------------------------------------

// Audit source/outcome use documented int32 values instead of proto enums:
//   source:  0 = unspecified (filter: all), 1 = user, 2 = system
//   outcome: 0 = unspecified (filter: all), 1 = success, 2 = failure, 3 = denied

message AuditLogEntry {
  uint64 id = 1;                     // monotonic row id
  google.protobuf.Timestamp created_at = 2;
  string actor = 3;                  // username; "system" when source = SYSTEM
  string actor_role = 4;             // admin|viewer; empty for system entries
  int32 source = 5;                  // 1 = user, 2 = system
  string action = 6;                 // dotted verb: image.delete, container.upgrade, network.prune, …
  string resource_type = 7;          // container|image|volume|network|builder|settings
  string resource_id = 8;            // daemon id where one exists, else empty
  int32 outcome = 9;                 // 1 = success, 2 = failure, 3 = denied
  string detail = 10;                // human summary (prune counts, names); error message on failure
}

message ListAuditLogsRequest {
  // Substring match over actor, action, resource_id and detail (server-side).
  string query = 1;
  int32 source = 2;                  // 0 = all, 1 = user, 2 = system
  int32 outcome = 3;                 // 0 = all, 1 = success, 2 = failure, 3 = denied
  uint32 limit = 4;                  // default 50, clamped to <= 200
  uint64 offset = 5;
}

message ListAuditLogsResponse {
  repeated AuditLogEntry entries = 1; // created_at DESC, id DESC — newest first, fixed order
  uint64 total = 2;                   // rows matching the filter, for n–m-of-T pagination
}

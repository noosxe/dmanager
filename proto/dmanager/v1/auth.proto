syntax = "proto3";

package dmanager.v1;

import "google/protobuf/timestamp.proto";

option go_package = "dmanager/internal/gen/proto/dmanager/v1;dmanagerv1";

service AuthService {
  // Check the setup and auth status of the server (Unauthenticated).
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);

  // Setup the primary administrator account (Unauthenticated, only if user count is 0).
  rpc SetupAdmin(SetupAdminRequest) returns (SetupAdminResponse);

  // Authenticate user credentials and establish a session cookie (Unauthenticated).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Expire the session token and clear the browser cookie (Authenticated).
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Retrieve current active user profile details (Authenticated).
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // List authentication audit events (Authenticated, viewers see own, admins see all).
  rpc ListAuthEvents(ListAuthEventsRequest) returns (ListAuthEventsResponse);

  // List active sessions for the authenticated user (Authenticated).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Revoke a specific active session for the authenticated user (Authenticated).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Revoke all other active sessions for the authenticated user except the current one (Authenticated).
  rpc RevokeAllOtherSessions(RevokeAllOtherSessionsRequest) returns (RevokeAllOtherSessionsResponse);

  // --- Passkey registration (Authenticated) ---
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);

  // --- Passkey login (Unauthenticated) ---
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse);
  rpc FinishPasskeyLogin(FinishPasskeyLoginRequest) returns (LoginResponse);

  // --- Credential management (Authenticated) ---
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc RenamePasskey(RenamePasskeyRequest) returns (RenamePasskeyResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);
}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  // Returns true if no users exist in the database, triggering onboarding.
  bool needs_setup = 1;
  // Returns true if WebAuthn / Passkeys Relying Party is configured and usable.
  bool passkey_login_enabled = 2;
  // Effective Relying Party ID.
  string rp_id = 3;
  // Effective Allowed Origins.
  repeated string origins = 4;
}

message SetupAdminRequest {
  string username = 1;
  string password = 2;
}

message SetupAdminResponse {
  string username = 1;
  string role = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool remember_me = 3;
}

message LoginResponse {
  string username = 1;
  string role = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  int64 user_id = 1;
  string username = 2;
  string role = 3;
}

message AuthEvent {
  int64 id = 1;
  optional int64 user_id = 2;
  string username = 3;
  string event_type = 4;
  string detail = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListAuthEventsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string event_type = 3;
}

message ListAuthEventsResponse {
  repeated AuthEvent events = 1;
  int64 total_count = 2;
}

message Session {
  string session_id = 1;
  string user_agent = 2;
  string device_label = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp absolute_expires_at = 7;
  bool is_current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeAllOtherSessionsRequest {}

message RevokeAllOtherSessionsResponse {
  int64 revoked_count = 1;
}

message BeginPasskeyRegistrationRequest {
  string name = 1;
}

message BeginPasskeyRegistrationResponse {
  // JSON-encoded PublicKeyCredentialCreationOptions for @github/webauthn-json
  string options_json = 1;
}

message FinishPasskeyRegistrationRequest {
  // User-provided friendly name for this passkey
  string name = 1;
  // JSON-encoded RegistrationResponseJSON from @github/webauthn-json
  string response_json = 2;
}

message FinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
}

message BeginPasskeyLoginRequest {}

message BeginPasskeyLoginResponse {
  // JSON-encoded PublicKeyCredentialRequestOptions for @github/webauthn-json (empty allow_credentials)
  string options_json = 1;
}

message FinishPasskeyLoginRequest {
  // JSON-encoded AuthenticationResponseJSON from @github/webauthn-json
  string response_json = 1;
  bool remember_me = 2;
}

message Passkey {
  string id = 1;
  string name = 2;
  string aaguid = 3;
  string friendly_device_name = 4;
  bool backup_eligible = 5;
  bool backup_state = 6;
  int32 sign_count = 7;
  bool clone_warning = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp last_used_at = 10;
}

message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message RenamePasskeyRequest {
  string id = 1;
  string name = 2;
}

message RenamePasskeyResponse {
  Passkey passkey = 1;
}

message DeletePasskeyRequest {
  string id = 1;
}

message DeletePasskeyResponse {}


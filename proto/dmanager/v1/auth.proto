syntax = "proto3";

package dmanager.v1;

import "google/protobuf/timestamp.proto";

option go_package = "dmanager/internal/gen/proto/dmanager/v1;dmanagerv1";

service AuthService {
  // Check the setup and auth status of the server (Unauthenticated).
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);

  // Setup the primary administrator account (Unauthenticated, only if user count is 0).
  rpc SetupAdmin(SetupAdminRequest) returns (SetupAdminResponse);

  // Authenticate user credentials and establish a session cookie (Unauthenticated).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Expire the session token and clear the browser cookie (Authenticated).
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Retrieve current active user profile details (Authenticated).
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // List authentication audit events (Authenticated, viewers see own, admins see all).
  rpc ListAuthEvents(ListAuthEventsRequest) returns (ListAuthEventsResponse);

  // List active sessions for the authenticated user (Authenticated).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // Revoke a specific active session for the authenticated user (Authenticated).
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // Revoke all other active sessions for the authenticated user except the current one (Authenticated).
  rpc RevokeAllOtherSessions(RevokeAllOtherSessionsRequest) returns (RevokeAllOtherSessionsResponse);
}

message GetServerStatusRequest {}

message GetServerStatusResponse {
  // Returns true if no users exist in the database, triggering onboarding.
  bool needs_setup = 1;
}

message SetupAdminRequest {
  string username = 1;
  string password = 2;
}

message SetupAdminResponse {
  string username = 1;
  string role = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  bool remember_me = 3;
}

message LoginResponse {
  string username = 1;
  string role = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message GetMeRequest {}

message GetMeResponse {
  int64 user_id = 1;
  string username = 2;
  string role = 3;
}

message AuthEvent {
  int64 id = 1;
  optional int64 user_id = 2;
  string username = 3;
  string event_type = 4;
  string detail = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListAuthEventsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string event_type = 3;
}

message ListAuthEventsResponse {
  repeated AuthEvent events = 1;
  int64 total_count = 2;
}

message Session {
  string session_id = 1;
  string user_agent = 2;
  string device_label = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp absolute_expires_at = 7;
  bool is_current = 8;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeAllOtherSessionsRequest {}

message RevokeAllOtherSessionsResponse {
  int64 revoked_count = 1;
}
